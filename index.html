<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kurashi-Log - 生活管理ダッシュボード Refined</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8fafc;
            --sidebar-bg: #0f172a;
            --sidebar-text: #94a3b8;
            --sidebar-active: #6366f1;
            --card-bg: #ffffff;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
            --info: #3b82f6;
            --savings: #6366f1;
            --bar-track: #e2e8f0; /* グラフの溝の色を少し濃く */
        }

        body { font-family: 'Inter', 'Noto Sans JP', sans-serif; margin: 0; display: flex; height: 100vh; background-color: var(--bg-color); color: var(--text-main); }

        /* --- サイドバー --- */
        aside { width: 260px; background: var(--sidebar-bg); color: var(--sidebar-text); display: flex; flex-direction: column; flex-shrink: 0; box-shadow: 4px 0 10px rgba(0,0,0,0.05); }
        .sidebar-header { padding: 32px 24px; font-size: 1.2rem; font-weight: 700; color: white; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #1e293b; }
        .nav-list { list-style: none; padding: 20px 12px; margin: 0; flex: 1; overflow-y: auto; }
        .nav-item { padding: 12px 16px; cursor: pointer; display: flex; align-items: center; gap: 12px; border-radius: 8px; transition: 0.2s; font-weight: 500; margin-bottom: 4px; }
        .nav-item:hover { background: #1e293b; color: white; }
        .nav-item.active { background: var(--sidebar-active); color: white; }
        .nav-icon { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; }
        .sidebar-footer { padding: 15px; border-top: 1px solid #1e293b; display: flex; flex-direction: column; gap: 8px; }

        /* --- メインレイアウト --- */
        .main-wrapper { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
        .top-bar { background: white; padding: 16px 40px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
        .content-area { padding: 40px; max-width: 1100px; margin: 0 auto; width: 100%; box-sizing: border-box; }
        .view-section { display: none; }
        .view-section.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* --- 共通パーツ --- */
        button { font-family: inherit; font-weight: 600; padding: 10px 18px; border-radius: 8px; border: none; cursor: pointer; font-size: 0.85rem; transition: 0.2s; display: inline-flex; align-items: center; gap: 6px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); }
        .btn-outline { background: white; border: 1px solid var(--border); color: var(--text-main); }
        .btn-outline:hover { background: #f8fafc; border-color: #cbd5e1; }
        .btn-ghost { background: transparent; color: var(--text-muted); padding: 6px; border-radius: 6px; }
        .btn-ghost:hover { color: var(--danger); background: #fee2e2; }

        .table-input { width: 100%; border: 1px solid transparent; background: transparent; padding: 8px; border-radius: 4px; font-family: inherit; font-size: 0.95rem; color: var(--text-main); transition: 0.2s; }
        .table-input:hover { background: #f1f5f9; border-color: var(--border); }
        .table-input:focus { background: white; border-color: var(--primary); outline: none; }
        .table-input.price { text-align: right; font-weight: 700; }

        .card { background: white; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 24px; overflow: hidden; }
        .card-header { padding: 16px 24px; background: #f8fafc; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .item-table { width: 100%; border-collapse: collapse; }
        .item-table td { padding: 8px 16px; border-bottom: 1px solid #f1f5f9; }
        input, select { padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.9rem; }

        /* --- グラフ・サマリー --- */
        .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 24px; margin-bottom: 24px; }
        .summary-card { padding: 24px; border-radius: 12px; color: white; }
        .summary-card.income { background: linear-gradient(135deg, #10b981, #059669); }
        .summary-card.expense { background: linear-gradient(135deg, #f43f5e, #e11d48); }
        .summary-card.savings { background: linear-gradient(135deg, #6366f1, #4f46e5); }
        .summary-value { font-size: 1.8rem; font-weight: 800; }

        .var-breakdown-item { margin-bottom: 16px; }
        .var-bar-info { display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 0.85rem; font-weight: 600; }
        .var-bar-container { height: 10px; background: var(--bar-track); border-radius: 5px; overflow: hidden; }
        .var-bar-fill { height: 100%; transition: width 0.5s ease; border-radius: 5px; }

        .category-tag { padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; display: inline-block; min-width: 90px; text-align: center; }
        .empty-state { padding: 40px; text-align: center; color: var(--text-muted); font-size: 0.9rem; }

        .chart-container { display: flex; align-items: flex-start; justify-content: space-around; padding: 20px; flex-wrap: wrap; gap: 40px; }
        .pie-chart-wrapper { position: relative; width: 180px; height: 180px; flex-shrink: 0; }
        .pie-chart { width: 100%; height: 100%; border-radius: 50%; background: conic-gradient(#eee 0% 100%); }
        .pie-chart-inner { position: absolute; top: 25%; left: 25%; width: 50%; height: 50%; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; color: var(--text-muted); font-size: 0.65rem; }
        .chart-legend { display: flex; flex-direction: column; gap: 10px; min-width: 200px; flex: 1; }
        .legend-item { display: flex; align-items: center; justify-content: space-between; gap: 15px; font-size: 0.85rem; }
        .legend-color { width: 10px; height: 10px; border-radius: 2px; display: inline-block; margin-right: 8px; }

        @media (max-width: 768px) {
            aside { width: 70px; }
            .nav-text, .sidebar-header span, .sidebar-footer { display: none; }
            .content-area { padding: 20px; }
        }
    </style>
</head>
<body>

<aside>
    <div class="sidebar-header">
        <svg class="nav-icon" viewBox="0 0 24 24" style="stroke: var(--primary);"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>
        <span>Kurashi-Log</span>
    </div>
    <ul class="nav-list">
        <li class="nav-item active" onclick="switchView('summary', this)">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 3v18h18"></path><path d="M18 9l-5 5-2-2-4 4"></path></svg>
            <span class="nav-text">収支サマリー</span>
        </li>
        <li class="nav-item" onclick="switchView('income', this)">
            <svg class="nav-icon" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"></rect><line x1="12" y1="8" x2="12" y2="16"></line></svg>
            <span class="nav-text">月別収入管理</span>
        </li>
        <li class="nav-item" onclick="switchView('variable', this)">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            <span class="nav-text">月別変動費管理</span>
        </li>
        <li class="nav-item" onclick="switchView('fixed', this)">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
            <span class="nav-text">固定費管理</span>
        </li>
        <li class="nav-item" onclick="switchView('subs', this)">
            <svg class="nav-icon" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"></rect></svg>
            <span class="nav-text">サブスク管理</span>
        </li>
        <li class="nav-item" onclick="switchView('moving', this)">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>
            <span class="nav-text">初期費用リスト</span>
        </li>
    </ul>
    <div class="sidebar-footer">
        <button class="btn-outline" style="background: #1e293b; color: white; border: none;" onclick="exportAllData()">全データ保存</button>
        <button class="btn-outline" style="background: #1e293b; color: white; border: none;" onclick="triggerImport()">データ読込</button>
        <button class="btn-ghost" style="color: #ef4444;" onclick="clearAllData()">データリセット</button>
    </div>
</aside>

<div class="main-wrapper">
    <header class="top-bar">
        <h1 id="viewTitle" style="margin:0; font-size:1.4rem; font-weight: 800;">収支サマリー</h1>
        <div>
            <span id="topStatLabel" style="font-size:0.8rem; color:var(--text-muted); display:block; text-align:right">今月の貯金額</span>
            <div style="font-size:1.4rem; font-weight:800; color:var(--primary)">¥<span id="topStatValue">0</span></div>
        </div>
    </header>

    <main class="content-area">
        <div id="global-month-nav" class="month-nav" style="display:flex; align-items:center; gap:15px; margin-bottom:24px;">
            <button class="btn-outline" onclick="App.changeGlobalMonth(-1)">◀</button>
            <div class="month-text-display" style="font-weight:700; font-size:1.1rem;"></div>
            <button class="btn-outline" onclick="App.changeGlobalMonth(1)">▶</button>
            <input type="month" id="monthPicker" onchange="App.setMonth(this.value)" style="margin-left:auto">
        </div>

        <section id="view-summary" class="view-section active">
            <div class="summary-grid">
                <div class="summary-card income"><span>総収入</span><div class="summary-value">¥<span id="sum-income">0</span></div></div>
                <div class="summary-card expense"><span>総支出</span><div class="summary-value">¥<span id="sum-expense">0</span></div></div>
                <div class="summary-card savings"><span>貯金（手残り）</span><div class="summary-value">¥<span id="sum-savings">0</span></div></div>
            </div>
            
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 24px;">
                <div class="card">
                    <div class="card-header"><span class="section-title">支出全体の内訳</span></div>
                    <div class="chart-container">
                        <div class="pie-chart-wrapper"><div class="pie-chart" id="incomePieChart"></div><div class="pie-chart-inner">SAVINGS</div></div>
                        <div class="chart-legend" id="summary-legend"></div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-header"><span class="section-title">変動費のカテゴリ別分析</span></div>
                    <div style="padding: 24px;" id="variable-analysis-container"></div>
                </div>
            </div>
        </section>

        <section id="view-list" class="view-section">
            <div class="card">
                <div style="padding:24px; display:flex; gap:12px; flex-wrap:wrap; align-items: flex-end;" id="input-area"></div>
            </div>
            <div class="card" style="overflow-x: auto;"><table class="item-table"><tbody id="listTableBody"></tbody></table></div>
        </section>

        <section id="view-moving" class="view-section">
            <div style="display:flex; gap:10px; margin-bottom:24px;">
                <input type="text" id="newStoreName" placeholder="店舗名" style="flex:1" onkeydown="if(event.key==='Enter')App.addStore()">
                <button class="btn-primary" onclick="App.addStore()">店舗追加</button>
            </div>
            <div id="movingListsContainer"></div>
        </section>
    </main>
</div>

<input type="file" id="universalFileInput" style="display:none" onchange="handleImport(event)">

<script>
/**
 * 集中管理型 Kurashi-Log システム
 */
const STORAGE_KEY = 'kurashi_log_v6';
const MAX_PRICE = 999999999; 

const App = {
    // --- データ状態 ---
    data: { moving: {}, fixed: [], subs: [], income: {}, variable: {} },
    currentView: 'summary',
    selectedMonth: '',

    // --- コンフィグ（タグ色とカテゴリ） ---
    CATEGORIES: {
        income: ["本業", "副業", "その他"],
        variable: ["食費", "日用品", "水道光熱費", "通信費", "交通費", "趣味・娯楽費", "交際費", "被服・美容費", "医療・健康費", "旅行・イベント費", "特別支出", "その他"],
        fixed: ["住宅", "水道光熱", "通信", "その他"]
    },

    TAG_COLORS: {
        "本業": { bg: "#dcfce7", text: "#16a34a" }, 
        "副業": { bg: "#e0f2fe", text: "#0284c7" },
        "食費": { bg: "#ffedd5", text: "#ea580c" }, 
        "日用品": { bg: "#ecfeff", text: "#0891b2" },
        "水道光熱費": { bg: "#ccfbf1", text: "#0d9488" }, 
        "通信費": { bg: "#f5f3ff", text: "#7c3aed" },
        "交通費": { bg: "#e0e7ff", text: "#4f46e5" }, 
        "趣味・娯楽費": { bg: "#fce7f3", text: "#db2777" },
        "交際費": { bg: "#ffe4e6", text: "#e11d48" }, 
        "被服・美容費": { bg: "#f3e8ff", text: "#9333ea" },
        "医療・健康費": { bg: "#fee2e2", text: "#dc2626" }, 
        "旅行・イベント費": { bg: "#fef3c7", text: "#d97706" },
        "特別支出": { bg: "#f1f5f9", text: "#475569" }, 
        "住宅": { bg: "#e0e7ff", text: "#4338ca" },
        "水道光熱": { bg: "#ccfbf1", text: "#0d9488" },
        "通信": { bg: "#f5f3ff", text: "#7c3aed" },
        "その他": { bg: "#f1f5f9", text: "#64748b" }
    },

    // --- コアメソッド ---
    init() {
        const now = new Date();
        this.selectedMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
        this.load();
        this.render();
    },

    load() {
        try {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) this.data = JSON.parse(saved);
        } catch (e) { console.error("Load failed", e); }
    },

    save() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(this.data));
    },

    setState(updater) {
        updater(this.data);
        this.save();
        this.render();
    },

    // --- アクション ---
    setMonth(m) { if(m) { this.selectedMonth = m; this.render(); } },

    changeGlobalMonth(offset) {
        const [y, m] = this.selectedMonth.split('-').map(Number);
        const d = new Date(y, m - 1 + offset, 1);
        this.setMonth(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`);
    },

    addStore() {
        const input = document.getElementById('newStoreName');
        const name = input.value.trim();
        if (!name || this.data.moving[name]) return;
        this.setState(d => { d.moving[name] = []; input.value = ''; });
    },

    executeAdd() {
        const nInput = document.getElementById('add-name');
        const pInput = document.getElementById('add-price');
        const name = nInput.value.trim();
        const price = parseInt(pInput.value) || 0;

        if (!name) return alert("項目名を入力してください");
        if (price < 0 || price > MAX_PRICE) return alert("正しい金額を入力してください");

        const cat = document.getElementById('add-cat')?.value || "その他";
        const item = { name, price, category: cat };

        if (this.currentView === 'subs') {
            item.cycle = document.getElementById('add-cycle').value;
            item.start = document.getElementById('add-start').value;
            item.end = document.getElementById('add-end').value;
        }

        this.setState(d => {
            if (['income', 'variable'].includes(this.currentView)) {
                if (!d[this.currentView][this.selectedMonth]) d[this.currentView][this.selectedMonth] = [];
                d[this.currentView][this.selectedMonth].push(item);
            } else {
                d[this.currentView].push(item);
            }
            nInput.value = ''; pInput.value = '';
        });
    },

    updateVal(type, idx, key, val, subKey = null) {
        this.setState(d => {
            const item = subKey ? d[type][subKey][idx] : d[type][idx];
            if (!item) return;
            item[key] = (key === 'price') ? Math.min(MAX_PRICE, Math.max(0, parseInt(val) || 0)) : val;
        });
    },

    deleteItem(type, idx, subKey = null) {
        if (!confirm("削除しますか？")) return;
        this.setState(d => {
            if (subKey) d[type][subKey].splice(idx, 1);
            else d[type].splice(idx, 1);
        });
    },

    // --- レンダリング ---
    render() {
        updateTopStats();
        document.querySelectorAll('.month-text-display').forEach(el => el.innerText = this.selectedMonth.replace('-', '年') + '月');
        const picker = document.getElementById('monthPicker'); if(picker) picker.value = this.selectedMonth;

        if (this.currentView === 'summary') renderSummary();
        else if (this.currentView === 'moving') renderMoving();
        else renderListSection();
    }
};

const fmt = (v) => Number(v).toLocaleString();
const getTagStyle = (cat) => {
    const s = App.TAG_COLORS[cat] || { bg: "#f1f5f9", text: "#475569" };
    return `background-color: ${s.bg}; color: ${s.text};`;
};

// --- ビュー切り替え ---
function switchView(view, el) {
    App.currentView = view;
    document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
    el.classList.add('active');
    
    const sid = (view === 'moving') ? 'view-moving' : (view === 'summary' ? 'view-summary' : 'view-list');
    document.getElementById(sid).classList.add('active');
    
    document.getElementById('global-month-nav').style.display = (['fixed', 'subs', 'moving'].includes(view)) ? 'none' : 'flex';
    const titles = { summary: '収支サマリー', income: '月別収入管理', variable: '月別変動費管理', fixed: '固定費管理', subs: 'サブスク管理', moving: '初期費用リスト' };
    document.getElementById('viewTitle').innerText = titles[view];
    App.render();
}

function updateTopStats() {
    const m = App.selectedMonth;
    const inc = (App.data.income[m] || []).reduce((a, b) => a + b.price, 0);
    const vEx = (App.data.variable[m] || []).reduce((a, b) => a + b.price, 0);
    const fEx = App.data.fixed.reduce((a, b) => a + b.price, 0);
    const sEx = App.data.subs.reduce((acc, s) => {
        if (m >= (s.start||"0000-00") && m <= (s.end||"9999-12")) return acc + (s.cycle === 'monthly' ? s.price : Math.round(s.price / 12));
        return acc;
    }, 0);

    let val = 0;
    const labels = { summary: '今月の貯金額', income: '収入合計', variable: '変動費合計', fixed: '固定費合計', subs: 'サブスク合計', moving: '初期費用合計' };
    document.getElementById('topStatLabel').innerText = labels[App.currentView];

    if (App.currentView === 'summary') val = inc - (vEx + fEx + sEx);
    else if (App.currentView === 'income') val = inc;
    else if (App.currentView === 'variable') val = vEx;
    else if (App.currentView === 'fixed') val = fEx;
    else if (App.currentView === 'subs') val = sEx;
    else { for (let s in App.data.moving) App.data.moving[s].forEach(i => val += i.price); }
    
    document.getElementById('topStatValue').innerText = fmt(val);
}

function renderSummary() {
    const m = App.selectedMonth;
    const curVars = (App.data.variable[m] || []);
    const inc = (App.data.income[m] || []).reduce((a, b) => a + b.price, 0);
    const vEx = curVars.reduce((a, b) => a + b.price, 0);
    const fEx = App.data.fixed.reduce((a, b) => a + b.price, 0);
    const sEx = App.data.subs.reduce((acc, s) => {
        if (m >= (s.start||"0000-00") && m <= (s.end||"9999-12")) return acc + (s.cycle === 'monthly' ? s.price : Math.round(s.price / 12));
        return acc;
    }, 0);
    const totalEx = vEx + fEx + sEx, sav = inc - totalEx;

    document.getElementById('sum-income').innerText = fmt(inc);
    document.getElementById('sum-expense').innerText = fmt(totalEx);
    document.getElementById('sum-savings').innerText = fmt(sav);

    // 円グラフ
    const den = Math.max(inc, totalEx, 1);
    const fP = (fEx/den)*100, vP = (vEx/den)*100, sP = (sEx/den)*100, savP = sav>0?(sav/den)*100:0;
    document.getElementById('incomePieChart').style.background = `conic-gradient(var(--danger) 0% ${fP}%, var(--warning) ${fP}% ${fP+vP}%, var(--info) ${fP+vP}% ${fP+vP+sP}%, var(--savings) ${fP+vP+sP}% ${fP+vP+sP+savP}%, #eee ${fP+vP+sP+savP}% 100%)`;
    document.getElementById('summary-legend').innerHTML = `
        <div class="legend-item"><span><i class="legend-color" style="background:var(--danger)"></i>固定費</span><b>${fP.toFixed(1)}% (¥${fmt(fEx)})</b></div>
        <div class="legend-item"><span><i class="legend-color" style="background:var(--warning)"></i>変動費</span><b>${vP.toFixed(1)}% (¥${fmt(vEx)})</b></div>
        <div class="legend-item"><span><i class="legend-color" style="background:var(--info)"></i>サブスク</span><b>${sP.toFixed(1)}% (¥${fmt(sEx)})</b></div>
        <div class="legend-item"><span><i class="legend-color" style="background:var(--savings)"></i>貯金</span><b>${savP.toFixed(1)}% (¥${fmt(Math.max(0,sav))})</b></div>
    `;

    // 変動費分析（棒グラフ）
    const container = document.getElementById('variable-analysis-container');
    if (!curVars.length) {
        container.innerHTML = `<div class="empty-state">データがありません</div>`;
    } else {
        const catTotals = {}; curVars.forEach(i => catTotals[i.category] = (catTotals[i.category]||0)+i.price);
        const sorted = Object.entries(catTotals).sort((a,b)=>b[1]-a[1]);
        const maxVal = sorted[0][1];
        container.innerHTML = sorted.map(([cat, val]) => {
            const percent = (val/vEx)*100, barWidth = (val/maxVal)*100;
            const color = App.TAG_COLORS[cat]?.text || '#6366f1';
            return `<div class="var-breakdown-item">
                <div class="var-bar-info">
                    <span>${cat} <small style="color:var(--text-muted); font-weight:normal;">(${percent.toFixed(1)}%)</small></span>
                    <span>¥${fmt(val)}</span>
                </div>
                <div class="var-bar-container">
                    <div class="var-bar-fill" style="width:${barWidth}%; background:${color}; shadow: 0 0 4px ${color}44"></div>
                </div>
            </div>`;
        }).join('');
    }
}

function renderListSection() {
    const inputArea = document.getElementById('input-area');
    const body = document.getElementById('listTableBody');
    const cats = App.CATEGORIES[App.currentView] || [];
    
    inputArea.innerHTML = `
        <div style="display:flex; flex-direction:column; gap:4px;"><label style="font-size:0.7rem;">項目名</label><input type="text" id="add-name" placeholder="例: Amazon"></div>
        <div style="display:flex; flex-direction:column; gap:4px;"><label style="font-size:0.7rem;">金額</label><input type="number" id="add-price" placeholder="¥" onkeydown="if(event.key==='Enter')App.executeAdd()"></div>
        ${cats.length ? `<div style="display:flex; flex-direction:column; gap:4px;"><label style="font-size:0.7rem;">カテゴリ</label><select id="add-cat">${cats.map(c => `<option value="${c}">${c}</option>`).join('')}</select></div>` : ''}
        ${App.currentView === 'subs' ? `<div style="display:flex; flex-direction:column; gap:4px;"><label style="font-size:0.7rem;">周期</label><select id="add-cycle"><option value="monthly">月額</option><option value="yearly">年額</option></select></div>
        <div style="display:flex; flex-direction:column; gap:4px;"><label style="font-size:0.7rem;">開始月</label><input type="month" id="add-start"></div>
        <div style="display:flex; flex-direction:column; gap:4px;"><label style="font-size:0.7rem;">終了月</label><input type="month" id="add-end"></div>` : ''}
        <button class="btn-primary" onclick="App.executeAdd()">追加</button>
    `;

    const list = ['income', 'variable'].includes(App.currentView) ? (App.data[App.currentView][App.selectedMonth]||[]) : App.data[App.currentView];
    body.innerHTML = list.length ? list.map((item, idx) => {
        const subKeyStr = ['income', 'variable'].includes(App.currentView) ? `'${App.selectedMonth}'` : 'null';
        let badge = item.category ? `<span class="category-tag" style="${getTagStyle(item.category)}">${item.category}</span>` : "";
        if (App.currentView === 'subs') {
            const active = (App.selectedMonth >= (item.start||"0000-00") && App.selectedMonth <= (item.end||"9999-12"));
            badge = active ? `<span style="color:var(--success); font-size:0.7rem;">● 有効</span>` : `<span style="color:var(--text-muted); font-size:0.7rem;">○ 期間外</span>`;
        }
        return `<tr><td style="width:100px">${badge}</td>
            <td><input class="table-input" value="${item.name}" onchange="App.updateVal('${App.currentView}', ${idx}, 'name', this.value, ${subKeyStr})"></td>
            <td style="width:130px"><input class="table-input price" type="number" value="${item.price}" onchange="App.updateVal('${App.currentView}', ${idx}, 'price', this.value, ${subKeyStr})"></td>
            ${App.currentView === 'subs' ? `<td style="width:100px"><select class="table-input" onchange="App.updateVal('subs', ${idx}, 'cycle', this.value)"><option value="monthly" ${item.cycle==='monthly'?'selected':''}>月額</option><option value="yearly" ${item.cycle==='yearly'?'selected':''}>年額</option></select></td>
            <td style="width:260px; font-size:0.8rem;"><input type="month" class="table-input" style="width:110px" value="${item.start||''}" onchange="App.updateVal('subs', ${idx}, 'start', this.value)"> 〜 <input type="month" class="table-input" style="width:110px" value="${item.end||''}" onchange="App.updateVal('subs', ${idx}, 'end', this.value)"></td>` : ''}
            <td style="width:40px"><button class="btn-ghost" onclick="App.deleteItem('${App.currentView}', ${idx}, ${subKeyStr})">✕</button></td></tr>`;
    }).join('') : `<tr><td colspan="6" class="empty-state">データがありません</td></tr>`;
}

function renderMoving() {
    const container = document.getElementById('movingListsContainer'); container.innerHTML = '';
    for (const store in App.data.moving) {
        const rows = App.data.moving[store].map((item, idx) => `<tr><td><input class="table-input" value="${item.name}" onchange="App.updateVal('moving', ${idx}, 'name', this.value, '${store}')"></td><td><input class="table-input price" type="number" value="${item.price}" onchange="App.updateVal('moving', ${idx}, 'price', this.value, '${store}')"></td><td style="width:40px"><button class="btn-ghost" onclick="App.deleteItem('moving', ${idx}, '${store}')">✕</button></td></tr>`).join('');
        const card = document.createElement('div'); card.className = 'card';
        card.innerHTML = `<div class="card-header"><span class="section-title">${store}</span><button class="btn-ghost" style="color:var(--danger)" onclick="if(confirm('店舗を削除？')){App.setState(d=>{delete d.moving['${store}']});}">削除</button></div>
            <div style="padding:12px 24px; border-bottom:1px solid #eee; display:flex; gap:12px; background: #fafafa;"><input type="text" id="m-n-${store}" placeholder="商品名" style="flex:1"><input type="number" id="m-p-${store}" placeholder="¥" style="width:100px" onkeydown="if(event.key==='Enter')addStoreItem('${store}')"><button class="btn-primary" onclick="addStoreItem('${store}')">追加</button></div><table class="item-table">${rows || '<tr><td class="empty-state">なし</td></tr>'}</table>`;
        container.appendChild(card);
    }
}

function addStoreItem(store) {
    const n = document.getElementById(`m-n-${store}`), p = document.getElementById(`m-p-${store}`);
    const name = n.value.trim(), price = parseInt(p.value) || 0;
    if (!name) return;
    App.setState(d => d.moving[store].push({name, price}));
}

function triggerImport() { document.getElementById('universalFileInput').click(); }
function handleImport(e) {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => { 
        try { 
            const imported = JSON.parse(evt.target.result); 
            App.setState(d => Object.assign(d, imported));
            alert("読み込み完了");
        } catch (err) { alert("無効なファイル形式です"); }
    };
    reader.readAsText(file);
}
function exportAllData() {
    const blob = new Blob([JSON.stringify(App.data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `kurashi_log_full.json`; a.click();
}
function clearAllData() { if(confirm('全てのリセット？')) App.setState(d => { d.moving={}; d.fixed=[]; d.subs=[]; d.income={}; d.variable={}; }); }

App.init();
</script>
</body>
</html>
